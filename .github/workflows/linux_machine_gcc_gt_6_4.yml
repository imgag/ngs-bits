name: Qt 6.4.2 on Ubuntu 24.04

on: [push, pull_request]
jobs:
  gcc-build-and-test:
    runs-on: ubuntu-24.04
    env:
      GENOME_URL: https://megsap.de/download/genome/GRCh38.fa.gz
      GENOME_FA_GZ: genome/GRCh38.fa.gz
      GENOME_FA: genome/GRCh38.fa
      GENOME_FAI_URL: https://megsap.de/download/genome/GRCh38.fa.fai
      GENOME_FAI: genome/GRCh38.fa.fai
    services:
      mysql:
        image: mysql:5.7
        env:
            MYSQL_ALLOW_EMPTY_PASSWORD: yes
            MYSQL_USER: test_user
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=2s --health-timeout=5s --health-retries=30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install packages
      run: |
        # Skip rebuilding the man-page index after every package install
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update
        sudo apt-get -y install --no-install-recommends wget make g++ git qt6-base-dev qmake6 libqt6sql6 libqt6sql6-mysql libqt6charts6-dev libbz2-dev libqt6svg6-dev liblzma-dev zlib1g-dev libcurl4 libcurl4-openssl-dev ca-certificates libtool pkg-config libxml2 libxml2-dev libssl-dev libdeflate-dev qt6-httpserver-dev qt6-websockets-dev tabix

    # ---- Reference genome (kept gzipped in the cache) ----
    # Restores the cache that the Ubuntu 26.04 workflow saves on master.
    # This workflow never saves it; it only downloads if no cache exists yet.
    - name: Restore reference genome from cache
      id: genome-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ env.GENOME_FA_GZ }}
          ${{ env.GENOME_FAI }}
        key: genome-GRCh38-v2

    - name: Download reference genome and index (cache miss)
      if: steps.genome-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$(dirname "$GENOME_FA_GZ")"
        curl -fSL --retry 5 --retry-all-errors -o "$GENOME_FA_GZ" "$GENOME_URL"
        curl -fSL --retry 5 --retry-all-errors -o "$GENOME_FAI" "$GENOME_FAI_URL"

    - name: Unpack reference genome
      # Keeps the .gz next to it; writes genome/GRCh38.fa
      run: gzip -dc "$GENOME_FA_GZ" > "$GENOME_FA"

    - name: Create settings for running tests
      run: .github/workflows/settings.sh
      shell: bash

    # ---- Compiler cache ----
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ runner.os }}-ubuntu-24.04
        max-size: 2G

    - name: Build htslib
      # htslib uses autoconf, which picks up the compiler from CC
      run: CC="ccache gcc" make build_3rdparty

    # THREADS and QMAKE_BIN are Makefile variables, overridden here.
    # CONFIG+=ccache makes qmake prefix the compiler with ccache.
    - name: Build
      run: |
        make THREADS=$(nproc) QMAKE_BIN="qmake6 CONFIG+=ccache" build_libs_release build_tools_release build_gui_release build_server_release
        ccache -s

    - name: Generate and trust SSL certificate
      run: |
        mkdir -p "$HOME/ssl"
        openssl req -new -newkey rsa:4096 -days 365 -nodes -x509 -subj "/C=DE/ST=BW/L=Tuebingen/O=test-certificate/CN=localhost" -keyout "$HOME/ssl/test-key.key" -out "$HOME/ssl/test-cert.crt"
        sudo cp "$HOME/ssl/test-cert.crt" /usr/local/share/ca-certificates
        sudo update-ca-certificates

    - name: Download test files
      run: make download_test_files

    - name: Start GSvar server and run tests
      run: |
        bin/GSvarServer &
        make -k test_lib test_server test_tools
