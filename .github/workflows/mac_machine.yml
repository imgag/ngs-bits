name: Qt 6.10.3 on MacOS 26 (arm64, M1)

on: [push, pull_request]
jobs:
  mac-build-and-test:
    runs-on: macos-26
    env:
      QT_VERSION: 6.10.3
      # Stop brew from auto-updating / cleaning up on every `brew install`
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1     
      GENOME_URL: https://megsap.de/download/genome/GRCh38.fa.gz
      GENOME_FA_GZ: genome/GRCh38.fa.gz
      GENOME_FA: genome/GRCh38.fa
      GENOME_FAI_URL: https://megsap.de/download/genome/GRCh38.fa.fai
      GENOME_FAI: genome/GRCh38.fa.fai
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Use all CPU cores for the build
      run: sed -i '' "s/-j5/-j$(sysctl -n hw.ncpu)/g" Makefile
      shell: bash

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.0.app

    - name: Install Homebrew dependencies
      run: brew install lzlib libxml2 mariadb-connector-c

    # ---- Qt: prebuilt modules from aqt, cached between runs ----
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v6
      with:
        path: ~/Qt
        key: qt-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_VERSION }}-charts-httpserver-websockets

    - name: Install Qt + Charts, HttpServer, WebSockets
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: |
        pipx install aqtinstall
        aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$HOME/Qt" -m qtcharts qthttpserver qtwebsockets

    - name: Add Qt to PATH
      run: echo "$HOME/Qt/$QT_VERSION/macos/bin" >> "$GITHUB_PATH"

    # ---- Compiler cache for the project's own build ----
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-macos-26
        max-size: 2G

    # THREADS and QMAKE_BIN are Makefile variables, so they can be overridden
    # here instead of sed-ing the Makefile. CONFIG+=ccache makes qmake prefix
    # the compiler with ccache.
    - name: Build project dependencies
      run: |
        make THREADS=$(sysctl -n hw.ncpu) QMAKE_BIN="qmake6 CONFIG+=ccache" build_3rdparty build_libs_release build_tools_release build_gui_release build_server_release
        ccache -s

    - name: Generate SSL certificate-key pair
      run: |
        mkdir -p "$HOME/ssl"
        openssl req -new -newkey rsa:4096 -days 365 -nodes -x509 -subj "/C=DE/ST=BW/L=Tuebingen/O=test-certificate/CN=localhost" -keyout "$HOME/ssl/test-key.key" -out "$HOME/ssl/test-cert.crt"

    # ---- Reference genome + index, from the cache saved on master ----
    # The Ubuntu 26.04 workflow saves this cache on master; this workflow only
    # restores it. Linux-made caches restore on macOS without extra options.
    - name: Restore reference genome from cache
      id: genome-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ env.GENOME_FA_GZ }}
          ${{ env.GENOME_FAI }}
        key: genome-GRCh38-v2

    - name: Download reference genome and index (cache miss)
      if: steps.genome-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$(dirname "$GENOME_FA_GZ")"
        curl -fSL --retry 5 --retry-all-errors -o "$GENOME_FA_GZ" "$GENOME_URL"
        curl -fSL --retry 5 --retry-all-errors -o "$GENOME_FAI" "$GENOME_FAI_URL"

    - name: Unpack reference genome    
      run: gzip -dc "$GENOME_FA_GZ" > "$GENOME_FA"

    - name: Create a settings.ini file for tests
      run: .github/workflows/settings_win_mac.sh
      shell: bash

    - name: Download test files
      run: make download_test_files

    - name: Run tests
      run: make -k -j$(sysctl -n hw.ncpu) test_lib test_tools
