name: Qt 6.10.1 on Windows Server 2025

on: [push, pull_request]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    env:
      # Compiler cache (MSYS2's ccache understands Windows paths)
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # replaces the separate "Update submodules" step

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: true
          # Only the Qt modules the project uses, instead of the full
          # mingw-w64-x86_64-qt6 metapackage (which pulls in WebEngine,
          # Multimedia, 3D, etc.). Add modules back if the build complains.
          install: >-
            git base-devel unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-zlib mingw-w64-x86_64-bzip2 mingw-w64-x86_64-xz
            mingw-w64-x86_64-curl mingw-w64-x86_64-dlfcn
            mingw-w64-x86_64-libmariadbclient mingw-w64-x86_64-sqlite3
            libsqlite libsqlite-devel
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-qt6-httpserver
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-svg

      - name: Unpack htslib and libxml2 into bin
        run: |
          (cd htslib && unzip -q htslib_win_64_qt6.zip)
          cp htslib/lib/hts.dll.a htslib/lib/hts-3.dll htslib/lib/libhts.a htslib/lib/zlib1.dll bin/
          (cd libxml2 && unzip -q -o libxml2_win_64.zip)
          cp libxml2/libs/* bin/

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-

      - name: Download test files
        run: make download_test_files

      # THREADS and QMAKE_BIN are Makefile variables, overridden here.
      # CONFIG+=ccache makes qmake prefix the compiler with ccache.
      - name: Build
        run: |
          make THREADS=$(nproc) QMAKE_BIN="qmake6 CONFIG+=ccache" build_libs_release build_tools_release build_gui_release build_server_release
          ccache -s

      - name: Create a settings.ini file for tests
        run: .github/workflows/settings_win_mac.sh
        shell: bash

      - name: Run tests
        run: make -k test_lib_windows test_tools_windows
